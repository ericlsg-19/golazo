<body>
<title>Golazo English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@500;600;700;800&display=swap">
<style>
/* Layout: menú de consola sobre un estadio nocturno animado (canvas fijo). Barra superior con pestañas; en celular, navegación inferior.
   Paneles de vidrio con esquina cortada, botones en paralelogramo, titulares itálicos condensados. */
:root{
  --bg:#060A18; --bg2:#0C1330; --glass:rgba(11,18,44,.76); --glass2:rgba(26,38,86,.82);
  --line:rgba(150,175,255,.16); --line2:rgba(150,175,255,.36);
  --fg:#F3F6FF; --muted:#9BA7CF; --acc:#1EE3B4; --acc-ink:#03261D; --acc2:#FF3D8B;
  --gold:#FFC93C; --gold-ink:#3A2A00; --ok:#2EE07A; --ok-ink:#04220F; --bad:#FF4D5E; --bad-ink:#2A0408; --sky:#5CC8FF;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cut:18px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
p{margin:0}
#stadium{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;transition:filter .8s ease}
#stadium.dim{filter:brightness(.42) saturate(.9)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:85;pointer-events:none}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,10,24,.35),rgba(6,10,24,.15) 40%,rgba(6,10,24,.75))}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,rgba(6,10,24,.95),rgba(6,10,24,.82));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand .crest{width:38px;height:44px}
.brand b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.brand small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.navtop{display:flex;gap:2px;margin-right:auto}
.navtop button{background:none;border:0;padding:10px 14px;font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
.navtop button[aria-current="page"]{color:var(--fg)}
.navtop button[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:3px;background:var(--acc);transform:skewX(-20deg)}
.navtop .dot,.tab .dot{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--acc2);color:#fff;font-size:10px;font-style:normal;font-family:var(--body);font-weight:800;padding:0 4px;margin-left:4px;vertical-align:top}
.coins{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;background:var(--glass2);border:1px solid var(--line2);font-family:var(--display);font-weight:800;font-size:20px;line-height:1;font-variant-numeric:tabular-nums;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.coin{width:20px;height:20px;flex:none}
.gear{background:var(--glass2);border:1px solid var(--line2);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.gear svg{width:20px;height:20px}
@media (max-width:860px){.navtop{display:none}}

/* ---------- main ---------- */
main.app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
@media (min-width:861px){main.app{padding-block:26px 48px}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.h1{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:clamp(40px,7vw,64px);line-height:.88;margin:4px 0 0;text-wrap:balance}
.h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:32px;line-height:.95;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.lead{font-weight:600;color:var(--muted);max-width:62ch;margin-top:6px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{--b:var(--acc);--i:var(--acc-ink);font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;letter-spacing:.04em;text-transform:uppercase;border:0;padding:10px 28px;min-height:50px;cursor:pointer;background:var(--b);color:var(--i);display:inline-flex;align-items:center;justify-content:center;gap:10px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .15s ease,filter .15s ease}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.gold{--b:var(--gold);--i:var(--gold-ink)}
.btn.pink{--b:var(--acc2);--i:#fff}
.btn.ghost{--b:rgba(255,255,255,.08);--i:var(--fg);box-shadow:inset 0 0 0 2px var(--line2)}
.btn.sm{font-size:17px;min-height:40px;padding:6px 18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:22px;height:22px}
.link{background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);position:relative}
.panel::before{content:"";position:absolute;left:0;top:0;width:52px;height:3px;background:var(--acc)}

/* ---------- home hub ---------- */
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .2s ease,border-color .2s ease;min-width:0}
.tile:hover{transform:translateY(-3px);border-color:var(--line2)}
.tlabel{font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.tile-match{grid-column:span 2;grid-row:span 2;background:linear-gradient(135deg,rgba(30,227,180,.16),transparent 45%),linear-gradient(0deg,rgba(255,61,139,.12),transparent 50%),var(--glass)}
.tile-obj{grid-column:span 1}
@media (max-width:860px){.hub{grid-template-columns:1fr 1fr}.tile-match,.tile-obj,.tile-board,.tile-chal,.tile-liga{grid-column:1/-1}.tile-match{grid-row:auto}}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;flex:1;padding:12px 0}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.side .crest{width:min(120px,26vw);height:auto}
.side b{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(20px,4vw,30px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.side span{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.vs{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(40px,8vw,72px);line-height:1;color:var(--acc);text-shadow:0 0 30px rgba(30,227,180,.5)}
.tinfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700;font-size:13px;line-height:1.2}
.pill b{font-weight:800}
.floatpack{width:min(120px,30vw);margin:4px auto;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.tile .grow{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.statrow{display:flex;gap:16px;justify-content:center}
.stat{text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.bar{height:8px;background:rgba(255,255,255,.08);overflow:hidden;transform:skewX(-20deg)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--sky))}
.objlist{display:flex;flex-direction:column;gap:8px}
.obj{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.obj.done{opacity:.5}
.obj .chk{width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--line2);transform:skewX(-12deg)}
.obj.ready .chk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.obj.done .chk{background:var(--line2)}
.obj p{font-weight:700;line-height:1.2;min-width:0}
.obj p small{display:block;color:var(--sky);font-weight:700;font-size:13px;font-style:italic}
.rw{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:4px}
.phrase{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:1;text-transform:none}

/* ---------- season ---------- */
.league{display:flex;flex-direction:column;gap:10px}
.league-head{display:flex;align-items:center;gap:14px}
.trophy{width:52px;height:52px;flex:none;color:var(--gold)}
.fixtures{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:420px){.fixtures{grid-template-columns:1fr}}
.fx{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 26px 10px 22px;background:var(--glass);border:0;text-align:left;cursor:pointer;width:100%;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:background .2s ease,transform .2s ease}
.fx:hover:not(:disabled){background:var(--glass2);transform:translateX(3px)}
.fx:disabled{opacity:.45;cursor:not-allowed}
.fx.next{background:linear-gradient(90deg,rgba(30,227,180,.28),var(--glass2))}
.fx.won{background:linear-gradient(90deg,rgba(255,201,60,.12),var(--glass))}
.fx .md{font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;line-height:1;color:var(--muted);width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.fx.next .md{color:var(--acc)}
.fx .crest{width:40px;height:46px}
.fx .t b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;line-height:1.05;text-transform:uppercase}
.fx .t span{display:block;color:var(--muted);font-size:13px;font-weight:700;line-height:1.3}
.fx .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:420px){.fx .md{display:none}.fx{grid-template-columns:auto minmax(0,1fr) auto}}
.stars{display:inline-flex;gap:1px}
.stars svg{width:17px;height:17px}
.packtag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;white-space:nowrap;transform:skewX(-12deg)}
.lockico{width:20px;height:20px;color:var(--muted)}

/* ---------- player cards ---------- */
.pcard{container-type:inline-size;width:100%;max-width:100%;aspect-ratio:3/4.25;position:relative;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.pc-in{position:absolute;inset:0;clip-path:polygon(50% 0,100% 5.5%,100% 86%,50% 100%,0 86%,0 5.5%);background:var(--cb);color:var(--ci);overflow:hidden}
.pc-in::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(62deg,transparent 0 6cqw,rgba(255,255,255,.07) 6cqw 7cqw),radial-gradient(70% 45% at 62% 30%,rgba(255,255,255,.35),transparent 70%)}
.pc-in::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.5) 48%,transparent 58%);transform:translateX(-80%);opacity:var(--shine,.6)}
.pcard.shine .pc-in::after,.cardbtn:hover .pc-in::after{animation:cardsweep 2.6s ease-in-out infinite}
@keyframes cardsweep{0%{transform:translateX(-80%)}55%,100%{transform:translateX(80%)}}
.pc-frame{position:absolute;inset:3.5cqw;clip-path:polygon(50% 0,100% 5.5%,100% 86%,50% 100%,0 86%,0 5.5%);box-shadow:inset 0 0 0 1cqw var(--ce);opacity:.7}
.pc-top{position:absolute;left:10cqw;top:13cqw;display:flex;flex-direction:column;align-items:center;gap:1.6cqw;z-index:3}
.pc-ovr{font-family:var(--display);font-weight:800;font-size:27cqw;line-height:.74}
.pc-pos{font-family:var(--display);font-weight:700;font-size:11.5cqw;line-height:1}
.pc-top .flag{width:15cqw;box-shadow:0 0 0 .5cqw rgba(0,0,0,.25)}
.pc-av{position:absolute;right:1cqw;top:7cqw;width:72cqw;height:auto;z-index:2}
.pc-name{position:absolute;left:7cqw;right:7cqw;top:65cqw;z-index:3;text-align:center;font-family:var(--display);font-weight:800;font-size:min(14cqw,calc(140cqw / var(--n,10)));line-height:1;text-transform:uppercase;padding:1.6cqw 5cqw .8cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#FFFFFF;background:rgba(8,12,28,.72);text-shadow:0 .4cqw .8cqw rgba(0,0,0,.5);clip-path:polygon(3cqw 0,100% 0,calc(100% - 3cqw) 100%,0 100%)}
.pc-line{position:absolute;left:16cqw;right:16cqw;top:81cqw;height:.6cqw;background:currentColor;opacity:.35;z-index:3}
.pc-stats{position:absolute;left:13cqw;right:13cqw;top:84cqw;z-index:3;display:grid;grid-template-columns:1fr 1fr;column-gap:8cqw;row-gap:.8cqw;font-size:8.8cqw;line-height:1.1;font-variant-numeric:tabular-nums}
.pc-stats span{display:flex;gap:1.6cqw;white-space:nowrap}
.pc-stats b{font-family:var(--display);font-weight:800;font-size:1.15em;min-width:2ch;line-height:1}
.pc-stats i{font-style:normal;font-weight:700;opacity:.8}
.pc-tier{position:absolute;left:0;right:0;top:120cqw;z-index:3;text-align:center;font-weight:800;font-size:5.6cqw;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.pcard.mini .pc-stats,.pcard.mini .pc-tier,.pcard.mini .pc-line{display:none}
.pcard.mini .pc-name{top:83cqw;left:4cqw;right:4cqw;font-size:min(17cqw,calc(165cqw / var(--n,10)));padding:1.8cqw 4cqw 1cqw}
.pcard.mini .pc-av{top:10cqw;width:76cqw;right:-2cqw}
.t-oro{--cb:linear-gradient(160deg,#FFF3C4 0%,#F0C75E 34%,#C08F2E 72%,#8C6216 100%);--ci:#3A2905;--ce:#FFF6D2}
.t-estrella{--cb:linear-gradient(160deg,#C9F6FF 0%,#4FA6FF 36%,#2343C9 72%,#121A66 100%);--ci:#FFFFFF;--ce:#9FE4FF}
.t-elite{--cb:linear-gradient(160deg,#FFD3EC 0%,#E35BD2 32%,#7B2CF0 70%,#2A0B66 100%);--ci:#FFFFFF;--ce:#FFB2EC}
.t-icono{--cb:linear-gradient(160deg,#FFFFFF 0%,#F9F0D4 38%,#D9B866 74%,#A47F2E 100%);--ci:#2A1E05;--ce:#FFFFFF;--shine:.9}
.locked .pc-in{--cb:linear-gradient(160deg,#25335E,#121A3A);--ci:#7383B8;--ce:#3B4C86;--shine:0}
.locked .pc-q{position:absolute;inset:22cqw 0 auto;text-align:center;font-family:var(--display);font-weight:900;font-size:44cqw;line-height:1;opacity:.45}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:18px 12px}
.cardbtn{background:none;border:0;padding:0;cursor:pointer;position:relative;display:block;width:100%;transition:transform .2s ease}
.cardbtn:hover:not(:disabled){transform:translateY(-4px) scale(1.02)}
.cardbtn:disabled{cursor:default}
.badge{position:absolute;top:-6px;right:-2px;z-index:5;background:var(--acc2);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;letter-spacing:.05em;transform:skewX(-12deg)}
.tierhead{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.tierhead h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;margin:0;line-height:1;text-transform:uppercase}
.tierdot{width:16px;height:16px;background:var(--cb);transform:skewX(-14deg)}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);padding:4px;gap:4px}
.seg button{background:none;border:0;padding:8px 18px;font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}

/* ---------- pitch ---------- */
.squad{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.squad{grid-template-columns:1fr}}
.pitch{position:relative;width:100%;aspect-ratio:100/128;overflow:hidden;background:repeating-linear-gradient(180deg,#1E7B40 0 8.33%,#196C38 8.33% 16.66%);box-shadow:0 20px 50px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.12)}
.pitch::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,transparent,rgba(0,0,0,.35));pointer-events:none}
.pitch svg.lines,.pitch svg.chem{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;width:18.5%;transform:translate(-50%,-50%);z-index:2}
.slot .empty-slot{aspect-ratio:3/4.25;border:2px dashed rgba(255,255,255,.4);display:grid;place-items:center;text-align:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.8);padding:4px;background:rgba(0,0,0,.2);clip-path:polygon(50% 0,100% 5.5%,100% 86%,50% 100%,0 86%,0 5.5%)}
.slot .lbl{display:block;text-align:center;font-size:10px;font-weight:800;letter-spacing:.08em;margin-top:2px;color:#fff;text-shadow:0 1px 2px #000}
.legend{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14px}
.legend span{display:flex;align-items:center;gap:10px}
.legend i{width:30px;height:4px;flex:none}
.bench{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.bench .cardbtn{width:92px;flex:none;scroll-snap-align:start}

/* ---------- flags ---------- */
.flag{width:28px;height:auto;box-shadow:0 0 0 1px rgba(0,0,0,.3);display:inline-block;vertical-align:middle;flex:none}
.flag.big{width:min(240px,70%);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.flag.mid{width:44px}
.flag.optf{width:min(110px,100%)}

/* ---------- overlay ---------- */
#ov{position:fixed;inset:0;z-index:50;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(6,10,24,.55)}
#ov.dark{background:rgba(4,6,16,.94)}
#ov.clear{background:transparent;backdrop-filter:none}
body.ovopen .top,body.ovopen main.app,body.ovopen .tabs{visibility:hidden}
.ov-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.ov-in.wide{max-width:1000px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* intro */
.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;cursor:pointer;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));border:0;background:transparent;width:100%}
.logo3d{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;line-height:.8;letter-spacing:-.01em}
.logo3d .l1{display:block;font-size:clamp(84px,22vw,200px);background:linear-gradient(180deg,#FFFFFF 30%,#9FB4FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 0 rgba(0,0,0,.45));animation:slam .7s cubic-bezier(.2,1.4,.4,1) both}
.logo3d .l2{display:block;font-size:clamp(46px,11vw,104px);color:var(--acc);text-shadow:0 0 40px rgba(30,227,180,.6);animation:slidein .6s .35s cubic-bezier(.2,1,.3,1) both;position:relative;overflow:hidden}
.logo3d .l2::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);animation:logosweep 1.4s .9s ease both;mix-blend-mode:overlay}
@keyframes slam{from{transform:scale(3);opacity:0;filter:blur(10px)}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(-60px) skewX(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes logosweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.tagline{font-weight:800;letter-spacing:.3em;font-size:14px;text-transform:uppercase;color:var(--fg);animation:fadeup .6s 1s both}
.press{font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;letter-spacing:.08em;text-transform:uppercase;animation:blink 1.4s ease-in-out infinite}
.press small{display:block;font-family:var(--body);font-style:normal;font-size:14px;letter-spacing:.04em;color:var(--muted);font-weight:700;text-transform:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.skip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* prematch */
.pre{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center;min-height:80vh}
.pre .versus .side:first-child{animation:fromL .6s cubic-bezier(.2,1,.3,1) both}
.pre .versus .side:last-child{animation:fromR .6s cubic-bezier(.2,1,.3,1) both}
.pre .vs{animation:slam .6s .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fromL{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes fromR{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}
.topicbox{padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px}

/* scorebug */
.bug{display:flex;align-items:stretch;align-self:flex-start;font-family:var(--display);font-weight:800;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:100%}
.bug .tm{display:flex;align-items:center;gap:8px;padding:4px 12px;background:#F3F6FF;color:#0B1230;font-size:22px;line-height:1;font-style:italic}
.bug .tm .crest{width:26px;height:30px}
.bug .sc{display:flex;align-items:center;padding:4px 14px;background:linear-gradient(180deg,#1A2A6C,#0C1440);color:#fff;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.bug .min{display:flex;align-items:center;padding:4px 10px;background:var(--acc);color:var(--acc-ink);font-size:20px;line-height:1}
.dots{display:flex;gap:5px}
.dots i{width:24px;height:6px;background:rgba(255,255,255,.14);transform:skewX(-20deg)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.cur{background:var(--gold)}
.bugrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* question */
.qcard{padding:20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qprompt{font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;line-height:.98;margin:0;text-wrap:balance;text-transform:none}
.qes{font-size:15px;font-weight:700;color:var(--sky);margin-top:6px;font-style:italic}
.qbody{font-size:23px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.qbody .hl{color:var(--gold)}
.qbody .big{font-family:var(--display);font-style:italic;font-size:50px;font-weight:800;color:var(--gold);line-height:1}
.qbody .sm{font-size:16px;color:var(--muted);font-weight:600}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--acc);text-align:center;color:var(--acc);line-height:1.1}
.center{text-align:center}
.bio{background:rgba(0,0,0,.25);padding:14px 16px;font-size:18px;font-weight:600;line-height:1.55;display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--sky)}
.bio p{flex:1;min-width:0}
.say{background:var(--sky);color:#04263A;border:0;min-width:46px;height:46px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none;font-weight:800;font-size:14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.say svg{width:22px;height:22px}
.say.alt{background:rgba(255,255,255,.1);color:var(--fg)}
.listen{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.listen .say.huge{width:110px;height:110px;padding:0;border-radius:50%;clip-path:none;box-shadow:0 0 0 10px rgba(92,200,255,.18),0 0 40px rgba(92,200,255,.45)}
.listen .say.huge svg{width:50px;height:50px}
.listen .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;padding:10px 14px;min-height:60px;border:0;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;text-align:left;line-height:1.2;overflow-wrap:anywhere;transition:background .15s ease,box-shadow .15s ease,transform .15s ease}
.opt:hover:not(:disabled){background:rgba(30,227,180,.12);box-shadow:inset 0 0 0 2px var(--acc);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt .key{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--k);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.opt .val{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.opts.long .opt .val{justify-content:flex-start;text-align:left}
.opt.ok{background:var(--ok);color:var(--ok-ink);box-shadow:none}
.opt.bad{background:var(--bad);color:var(--bad-ink);box-shadow:none}
.opt.dim{opacity:.4}
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border:2px dashed var(--line2);align-items:center;background:rgba(0,0,0,.2)}
.slots .punct{font-size:26px;font-weight:800;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chipw{font-weight:800;font-size:19px;padding:9px 16px;border:0;background:var(--fg);color:var(--bg);cursor:pointer;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.chipw.in{background:var(--gold);color:var(--gold-ink)}
.chipw.okc{background:var(--ok);color:var(--ok-ink)}
.chipw.badc{background:var(--bad);color:var(--bad-ink)}
.ph{width:46px;height:5px;background:var(--line2)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{font-weight:700;font-size:17px;padding:10px;border:0;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.mi.sel{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(255,201,60,.12)}
.mi.done{background:var(--ok);color:var(--ok-ink);box-shadow:none;opacity:.5;cursor:default}
.mi.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:linear-gradient(90deg,rgba(46,224,122,.22),rgba(46,224,122,.06));border-left:4px solid var(--ok)}
.fb.bad{background:linear-gradient(90deg,rgba(255,77,94,.22),rgba(255,77,94,.06));border-left:4px solid var(--bad)}
.fb h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;margin:0;line-height:1;text-transform:uppercase}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb .tip{font-size:16px;font-weight:600;line-height:1.45}
.fb .ans{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* goal celebration */
.goal{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;background:radial-gradient(60% 50% at 50% 50%,rgba(30,227,180,.25),transparent 70%);animation:fadeout 1.9s ease forwards}
.goal .gt{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(90px,26vw,240px);line-height:.8;text-transform:uppercase;background:linear-gradient(100deg,#fff 20%,var(--acc) 45%,#fff 55%,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 0 rgba(0,0,0,.4));animation:goalin .5s cubic-bezier(.2,1.5,.4,1) both,goalsweep 1.2s .3s ease both}
.goal .gs{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(22px,5vw,36px);text-transform:uppercase;background:var(--acc);color:var(--acc-ink);padding:4px 22px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);animation:fromL .5s .2s both}
.goal .ge{font-weight:700;font-size:18px;color:var(--fg);text-shadow:0 2px 6px #000;animation:fadeup .5s .4s both}
.goal.rival{background:radial-gradient(60% 40% at 50% 50%,rgba(255,77,94,.25),transparent 70%);animation-duration:1.5s}
.goal.rival .gt{font-size:clamp(46px,12vw,100px);background:none;color:var(--bad);-webkit-background-clip:initial;background-clip:initial;animation:goalin .4s both}
.goal.rival .gs{background:var(--bad);color:#fff}
@keyframes goalin{from{transform:scale(.2) skewX(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes goalsweep{from{background-position:100% 0}to{background-position:0 0}}
@keyframes fadeout{0%,75%{opacity:1}100%{opacity:0}}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
.result h2{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(60px,15vw,100px);line-height:.85;margin:0;text-transform:uppercase}
.final{display:flex;align-items:center;gap:16px;font-family:var(--display);font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.final .crest{width:64px;height:74px}
.result .stars svg{width:46px;height:46px;animation:slam .5s both}
.result .stars svg:nth-child(2){animation-delay:.2s}.result .stars svg:nth-child(3){animation-delay:.4s}
.result .actions{display:flex;flex-direction:column;gap:10px;width:min(380px,100%)}
.mstats{width:min(460px,100%);display:flex;flex-direction:column;gap:2px}
.mstats div{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 14px;background:rgba(255,255,255,.05);font-weight:700;text-align:left}
.tile-liga{grid-column:1/-1}
.rank{display:flex;flex-direction:column;gap:4px}
.rk{display:grid;grid-template-columns:2.2em auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.05)}
.rk.me{background:linear-gradient(90deg,rgba(30,227,180,.25),rgba(30,227,180,.06));box-shadow:inset 3px 0 0 var(--acc)}
.rk .pos{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;line-height:1;text-align:center;color:var(--muted)}
.rk:nth-child(1) .pos{color:var(--gold)}.rk:nth-child(2) .pos{color:#D7DEEE}.rk:nth-child(3) .pos{color:#E0A36B}
.rk .crest{width:30px;height:35px}
.rk p{font-weight:800;line-height:1.15;min-width:0;overflow-wrap:anywhere}.rk p small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.rk b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.rk b small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:800}
.champ{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(90deg,rgba(255,201,60,.22),rgba(255,201,60,.04));border-left:3px solid var(--gold);font-weight:700}
.champ svg{width:34px;height:34px;color:var(--gold);flex:none}
.mstats.cmp div{grid-template-columns:1fr;gap:2px}.mstats.cmp b{font-family:var(--body);font-size:15px;line-height:1.3}
.mstats b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.reward{display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;width:min(460px,100%)}
.mvp{display:flex;align-items:center;gap:16px;width:min(460px,100%);padding:12px 16px;text-align:left}
.mvp .pcard{width:90px;flex:none}

/* packs */
.k-oro,.k-bienvenida{--pk:linear-gradient(160deg,#FFF3C4,#E9B949 42%,#8C6216)}
.k-estrella{--pk:linear-gradient(160deg,#C9F6FF,#4FA6FF 40%,#121A66)}
.k-elite{--pk:linear-gradient(160deg,#FFD3EC,#E35BD2 36%,#2A0B66)}
.packart{width:100%;aspect-ratio:3/4.4;background:var(--pk);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;color:#fff;box-shadow:0 14px 30px rgba(0,0,0,.5);container-type:inline-size;clip-path:polygon(0 4%,8% 0,92% 0,100% 4%,100% 96%,92% 100%,8% 100%,0 96%)}
.packart::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(62deg,transparent 0 8cqw,rgba(255,255,255,.12) 8cqw 9cqw)}
.packart::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);animation:sweep 3s ease-in-out infinite}
.packart b{position:relative;font-family:var(--display);font-style:italic;font-weight:900;font-size:24cqw;line-height:.8;text-transform:uppercase;text-shadow:0 1cqw 0 rgba(0,0,0,.35)}
.packart span{position:relative;font-weight:800;font-size:7.5cqw;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.packart svg{position:relative;width:36cqw;height:36cqw;filter:drop-shadow(0 1cqw 1cqw rgba(0,0,0,.35))}
@keyframes sweep{0%,30%{transform:translateX(-60%)}70%,100%{transform:translateX(60%)}}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:82vh;position:relative}
.spot{position:absolute;inset:0;background:radial-gradient(40% 50% at 50% 45%,rgba(255,255,255,.12),transparent 70%);pointer-events:none}
.tearbtn{background:none;border:0;padding:0;cursor:pointer;width:min(240px,60vw);animation:float 2.6s ease-in-out infinite;position:relative}
.tearbtn.shake{animation:packshake .6s ease both}
@keyframes packshake{0%,100%{transform:none}20%{transform:rotate(-6deg) scale(1.04)}40%{transform:rotate(6deg) scale(1.08)}60%{transform:rotate(-8deg) scale(1.12)}80%{transform:rotate(8deg) scale(1.2);filter:brightness(2)}}
.walk{position:relative;width:100%;min-height:84vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer;border:0;background:transparent;padding:20px;overflow:hidden}
.beam{position:absolute;left:50%;bottom:0;width:min(340px,70vw);height:110%;transform:translateX(-50%);background:linear-gradient(0deg,var(--glow),transparent 85%);filter:blur(20px);opacity:.8;animation:beam 1.2s ease both;pointer-events:none}
@keyframes beam{from{transform:translateX(-50%) scaleY(0);transform-origin:bottom}to{transform:translateX(-50%) scaleY(1)}}
.clue{position:relative;font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(46px,12vw,92px);line-height:.9;text-transform:uppercase;animation:clue .6s cubic-bezier(.2,1.3,.4,1) both;text-shadow:0 6px 0 rgba(0,0,0,.4);text-wrap:balance}
.clue small{display:block;font-family:var(--body);font-style:normal;font-size:clamp(18px,4vw,24px);font-weight:700;color:var(--fg);margin-top:12px;text-transform:none;text-shadow:0 2px 6px #000}
.clue em{display:block;font-family:var(--body);font-style:italic;font-size:15px;font-weight:600;color:var(--muted);margin-top:4px;text-transform:none;text-shadow:none}
@keyframes clue{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
.revealcard{width:min(270px,66vw);animation:flip .8s cubic-bezier(.2,.9,.3,1.25) both;position:relative}
@keyframes flip{from{transform:perspective(900px) rotateY(160deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.newtag{font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:5px 14px;background:var(--acc);color:var(--acc-ink);transform:skewX(-12deg)}
.newtag.dup{background:rgba(255,255,255,.12);color:var(--fg)}
.packgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,170px));justify-content:center;gap:16px;width:100%}
.packgrid .it{display:flex;flex-direction:column;align-items:center;gap:8px;animation:flip .7s cubic-bezier(.2,.9,.3,1.2) both}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.shopitem{padding:16px;display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center}
.shopitem h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;margin:0;line-height:1;text-transform:uppercase}
.shopitem p{font-size:14px;color:var(--muted);font-weight:600;margin:4px 0 10px}
.inv{display:flex;gap:16px;flex-wrap:wrap}
.inv .it{width:118px;display:flex;flex-direction:column;gap:10px}
.empty{padding:18px;color:var(--muted);font-weight:600}

/* board */
.lesson{padding:20px;display:flex;flex-direction:column;gap:12px}
.lesson h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;margin:0;line-height:1;text-transform:uppercase}
.note{background:rgba(0,0,0,.22);padding:10px 14px;font-weight:600;font-size:15px;border-left:3px solid var(--acc);max-width:70ch}
.tblwrap{overflow-x:auto;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:440px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:9px 12px;background:rgba(0,0,0,.25);font-weight:800}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);font-weight:600;vertical-align:middle}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.sp{background:none;border:0;padding:0;cursor:pointer;font-weight:800;color:var(--fg);border-bottom:2px dotted var(--sky);text-align:left}
.sp:hover{color:var(--sky)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mini h4{margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mini ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-weight:600}
.contgrid{display:flex;flex-wrap:wrap;gap:8px}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,270px) 1fr;gap:24px;align-items:start}
.tilt{perspective:900px}
.tilt .pcard{transition:transform .15s ease-out;transform-style:preserve-3d}
.facts{display:flex;flex-direction:column;gap:8px;min-width:0}
.fact{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.05);border-left:3px solid var(--sky)}
.fact p{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.25}
.fact p small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.fact .say{min-width:40px;height:40px}
@media (max-width:600px){.detail{grid-template-columns:1fr}.detail .tilt{width:min(230px,62vw);margin:0 auto}}

/* welcome / settings */
.welcome{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;justify-content:center;flex:1;min-height:84vh}
.field{display:flex;flex-direction:column;gap:6px;width:min(380px,100%);text-align:left}
.field label{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border:0;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px var(--line2);color:var(--fg)}
.field input:focus{box-shadow:inset 0 0 0 2px var(--acc);outline:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:52px;height:60px;border:0;padding:0;background:none;cursor:pointer;opacity:.6;transition:transform .15s ease,opacity .15s ease}
.sw[aria-pressed="true"]{opacity:1;transform:scale(1.12)}
.sw .crest{width:100%;height:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:rgba(255,255,255,.05);font-weight:700;border:0;width:100%;cursor:pointer;text-align:left}
.toggle i{width:52px;height:28px;background:rgba(255,255,255,.15);position:relative;flex:none;transition:background .2s ease}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;transition:transform .2s ease}
.toggle[aria-pressed="true"] i{background:var(--acc)}
.toggle[aria-pressed="true"] i::after{transform:translateX(24px)}

/* tabs (phone) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,10,24,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--acc)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--acc)}
.tab .dot{position:absolute;top:4px;left:calc(50% + 6px);margin:0}
@media (min-width:861px){.tabs{display:none}}

/* toast, tutorial, informe, desafíos */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--fg);color:var(--bg);font-weight:800;padding:10px 18px;max-width:min(90vw,460px);text-align:center;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);animation:fadeup .3s both}
.tut{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:80vh}
.tut .big{width:120px;height:120px;display:grid;place-items:center;border-radius:50%;background:rgba(30,227,180,.14);box-shadow:0 0 0 10px rgba(30,227,180,.07);animation:clue .5s both}
.tut .big svg{width:64px;height:64px}
.tut p.lead{margin:0 auto;font-size:18px;color:var(--fg)}
.tutdots{display:flex;gap:6px}.tutdots i{width:22px;height:5px;background:rgba(255,255,255,.18);transform:skewX(-20deg)}.tutdots i.on{background:var(--acc)}
.demo-opt{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,.08);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{padding:14px;text-align:center}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.rep{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,38%) 3.2em;gap:12px;align-items:center;padding:9px 12px;background:rgba(255,255,255,.04)}
.rep p{font-weight:700;line-height:1.2;min-width:0}.rep p small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.rep .track{height:10px;background:rgba(255,255,255,.08);transform:skewX(-20deg);overflow:hidden}.rep .track i{display:block;height:100%}
.rep b{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.lvlpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lvlpick button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px;background:rgba(255,255,255,.06);border:0;box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;font-weight:700;line-height:1.15}
.lvlpick button:hover{box-shadow:inset 0 0 0 2px var(--acc)}
.lvlpick .crest{width:30px;height:35px;flex:none}
.codeline{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px);letter-spacing:.06em;word-break:break-all;padding:10px 14px;background:rgba(0,0,0,.3);border-left:3px solid var(--acc);text-align:left}
.vsres{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.vsres div{text-align:center}.vsres b{display:block;font-family:var(--display);font-weight:800;font-size:64px;line-height:1}.vsres span{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* modo profe */
.packtag.soon{background:rgba(255,255,255,.12);color:var(--fg)}
.field textarea,.field select{font:inherit;font-size:17px;font-weight:600;padding:10px 12px;border:0;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px var(--line2);color:var(--fg);resize:vertical;min-height:90px;line-height:1.4}
.field textarea:focus{box-shadow:inset 0 0 0 2px var(--acc);outline:none}
.field input.sm{font-size:17px;padding:10px 12px}
.field small{color:var(--muted);font-weight:600;font-size:13px}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
.ed-row h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;margin:0;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.ed-row p{color:var(--muted);font-weight:600;font-size:14px}
.ed-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ed-btns .btn{padding:4px 14px;min-height:36px;font-size:16px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:rgba(255,255,255,.05)}
.qrow p{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.qtype{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;background:var(--sky);color:#04263A;white-space:nowrap}
.msg{padding:12px 14px;font-weight:700;background:rgba(92,200,255,.12);border-left:3px solid var(--sky)}
.msg.warn{background:rgba(255,201,60,.12);border-color:var(--gold)}
.edform{padding:16px;display:flex;flex-direction:column;gap:12px}
.edform .field{width:100%}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;background:rgba(0,0,0,.3);padding:10px 12px;border-left:3px solid var(--line2);overflow-wrap:anywhere}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

<script>
/* =========================================================
   Golazo English · juego para aprender inglés estilo Ultimate Team
   ========================================================= */
const STORE = 'golazo-english-v1';
// fuente canónica de la página, para que el Modo profe pueda republicarla con unidades nuevas
const SELF_SRC = document.currentScript ? document.currentScript.textContent : '';

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
const uniq = a => [...new Set(a)];
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- países ---------------- */

};
const CODES = Object.keys(C);
const CONTS = ['Africa', 'Antarctica', 'Asia', 'Europe', 'North America', 'South America', 'Oceania'];

const LANG_ES = { Spanish: 'español', Portuguese: 'portugués', English: 'inglés', French: 'francés', German: 'alemán', Italian: 'italiano', Dutch: 'neerlandés', Norwegian: 'noruego', Croatian: 'croata', Arabic: 'árabe', Japanese: 'japonés', Korean: 'coreano', Chinese: 'chino', Hindi: 'hindi' };
const langParts = s => s.split(' and ');

const cn = c => C[c].n;          // nombre en medio de oración
const CN = c => cap(C[c].n);     // nombre al inicio / suelto

/* ---------------- banderas (SVG dibujado a mano) ---------------- */
const R = (x, y, w, h, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
const H3 = (a, b, c) => R(0, 0, 30, 6.7, a) + R(0, 6.66, 30, 6.7, b) + R(0, 13.33, 30, 6.67, c);
const V3 = (a, b, c) => R(0, 0, 10.05, 20, a) + R(10, 0, 10.05, 20, b) + R(20, 0, 10, 20, c);
const CI = (x, y, r, f) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const STAR = (cx, cy, r, f, stroke) => {
  const p = [];
  for (let i = 0; i < 10; i++) { const a = (-90 + i * 36) * Math.PI / 180, rr = i % 2 ? r * .4 : r; p.push((cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2)); }
  return stroke ? `<polygon points="${p.join(' ')}" fill="none" stroke="${f}" stroke-width="${stroke}"/>` : `<polygon points="${p.join(' ')}" fill="${f}"/>`;
};
const FLAG = {
  ARG: () => H3('#74ACDF', '#FFFFFF', '#74ACDF') + CI(15, 10, 2.3, '#F6B40E'),
  BRA: () => R(0, 0, 30, 20, '#009C3B') + '<polygon points="15,2.2 27.5,10 15,17.8 2.5,10" fill="#FFDF00"/>' + CI(15, 10, 4.4, '#002776'),
  URU: () => { let s = R(0, 0, 30, 20, '#FFFFFF'); for (const i of [1, 3, 5, 7]) s += R(0, i * 20 / 9, 30, 20 / 9, '#0038A8'); return s + R(0, 0, 11.1, 11.1, '#FFFFFF') + CI(5.5, 5.5, 2.6, '#FCD116'); },
  COL: () => R(0, 0, 30, 10, '#FCD116') + R(0, 10, 30, 5, '#003893') + R(0, 15, 30, 5, '#CE1126'),
  CHI: () => R(0, 0, 30, 10, '#FFFFFF') + R(0, 10, 30, 10, '#D52B1E') + R(0, 0, 10, 10, '#0039A6') + STAR(5, 5.2, 2.8, '#FFFFFF'),
  PER: () => V3('#D91023', '#FFFFFF', '#D91023'),
  MEX: () => V3('#006847', '#FFFFFF', '#CE1126') + CI(15, 10, 2.2, '#8C5B2B'),
  USA: () => { let s = ''; for (let i = 0; i < 13; i++) s += R(0, i * 20 / 13, 30, 20 / 13 + .02, i % 2 ? '#FFFFFF' : '#B22234'); s += R(0, 0, 12, 20 * 7 / 13, '#3C3B6E'); for (let y = 0; y < 4; y++) for (let x = 0; x < 5; x++) s += CI(1.4 + x * 2.3, 1.4 + y * 2.4, .45, '#FFFFFF'); return s; },
  CAN: () => R(0, 0, 30, 20, '#FFFFFF') + R(0, 0, 7.5, 20, '#D52B1E') + R(22.5, 0, 7.5, 20, '#D52B1E') + STAR(15, 9.4, 4.6, '#D52B1E') + R(14.5, 11, 1, 4.2, '#D52B1E'),
  FRA: () => V3('#0055A4', '#FFFFFF', '#EF4135'),
  ESP: () => R(0, 0, 30, 20, '#AA151B') + R(0, 5, 30, 10, '#F1BF00'),
  ENG: () => R(0, 0, 30, 20, '#FFFFFF') + R(13, 0, 4, 20, '#CE1124') + R(0, 8, 30, 4, '#CE1124'),
  GER: () => H3('#000000', '#DD0000', '#FFCE00'),
  ITA: () => V3('#009246', '#FFFFFF', '#CE2B37'),
  POR: () => R(0, 0, 12, 20, '#006600') + R(12, 0, 18, 20, '#FF0000') + '<circle cx="12" cy="10" r="3.4" fill="none" stroke="#FFCC00" stroke-width="1.3"/>' + R(10.8, 8.4, 2.4, 3.2, '#FFFFFF'),
  NED: () => H3('#AE1C28', '#FFFFFF', '#21468B'),
  BEL: () => V3('#000000', '#FDDA24', '#EF3340'),
  NOR: () => R(0, 0, 30, 20, '#BA0C2F') + R(8, 0, 4, 20, '#FFFFFF') + R(0, 8, 30, 4, '#FFFFFF') + R(9, 0, 2, 20, '#00205B') + R(0, 9, 30, 2, '#00205B'),
  CRO: () => { let s = H3('#FF0000', '#FFFFFF', '#171796'); for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) s += R(12.5 + x * 1.25, 5 + y * 1.5, 1.25, 1.5, (x + y) % 2 ? '#FFFFFF' : '#FF0000'); return s; },
  EGY: () => H3('#CE1126', '#FFFFFF', '#000000') + R(14, 8.3, 2, 3.4, '#C09300'),
  MAR: () => R(0, 0, 30, 20, '#C1272D') + STAR(15, 10.5, 5, '#006233', .9),

  SEN: () => V3('#00853F', '#FDEF42', '#E31B23') + STAR(15, 10.4, 2.6, '#00853F'),
  JPN: () => R(0, 0, 30, 20, '#FFFFFF') + CI(15, 10, 6, '#BC002D'),
  KOR: () => {
    const bars = (x, y, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})">${R(-2, -2, 4, .8, '#000000')}${R(-2, -.4, 4, .8, '#000000')}${R(-2, 1.2, 4, .8, '#000000')}</g>`;
    return R(0, 0, 30, 20, '#FFFFFF') + CI(15, 10, 5, '#0047A0') + '<path d="M10 10a5 5 0 0 1 10 0z" fill="#CD2E3A"/>' + bars(5, 4, -34) + bars(25, 4, 34) + bars(5, 16, 34) + bars(25, 16, -34);
  },
  CHN: () => R(0, 0, 30, 20, '#DE2910') + STAR(5.5, 5.5, 3, '#FFDE00') + STAR(10.5, 2.2, 1, '#FFDE00') + STAR(12.5, 4.4, 1, '#FFDE00') + STAR(12.5, 7.4, 1, '#FFDE00') + STAR(10.5, 9.6, 1, '#FFDE00'),
  IND: () => H3('#FF9933', '#FFFFFF', '#138808') + '<circle cx="15" cy="10" r="2.5" fill="none" stroke="#000080" stroke-width=".7"/>',
  AUS: () => R(0, 0, 30, 20, '#012169') + '<path d="M0 0L15 10M15 0L0 10" stroke="#FFFFFF" stroke-width="2"/>' + R(6, 0, 3, 10, '#FFFFFF') + R(0, 3.5, 15, 3, '#FFFFFF') + R(6.75, 0, 1.5, 10, '#C8102E') + R(0, 4.25, 15, 1.5, '#C8102E') + STAR(7.5, 15, 2, '#FFFFFF') + STAR(22.5, 4, 1, '#FFFFFF') + STAR(26, 9, 1, '#FFFFFF') + STAR(20, 12, 1, '#FFFFFF') + STAR(22.5, 16.5, 1, '#FFFFFF'),
};
const flag = (code, cls = 'flag') => `<svg class="${cls}" viewBox="0 0 30 20" aria-hidden="true">${FLAG[code]()}</svg>`;

/* ---------------- jugadores (medias inventadas para el juego) ---------------- */

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v * (1 + amt))));
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ---------------- sonido (sintetizado, sin archivos) ---------------- */
const AU = {
  ctx: null, noise: null, amb: null,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 3, this.ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.noise = b; } catch (e) { } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  ok() { return S.sound && this.ctx; },
  tone(f, dur, type = 'sine', vol = .1, f2, delay = 0) {
    if (!this.ok()) return; const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + .05);
  },
  hiss(dur, ftype, f, vol, { q = .8, attack = .05, f2, delay = 0 } = {}) {
    if (!this.ok()) return; const t = this.ctx.currentTime + delay, s = this.ctx.createBufferSource(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noise; s.loop = true; fl.type = ftype; fl.frequency.setValueAtTime(f, t); fl.Q.value = q; if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl).connect(g).connect(this.ctx.destination); s.start(t); s.stop(t + dur + .05);
  },
  whistle(n = 1) {
    if (!this.ok()) return;
    for (let i = 0; i < n; i++) {
      const len = i === n - 1 && n > 1 ? .7 : .28, t = this.ctx.currentTime + i * .42, o = this.ctx.createOscillator(), lfo = this.ctx.createOscillator(), lg = this.ctx.createGain(), g = this.ctx.createGain();
      o.frequency.value = 2900; lfo.frequency.value = 38; lg.gain.value = 140; lfo.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .02); g.gain.setValueAtTime(.09, t + len - .05); g.gain.linearRampToValueAtTime(0, t + len);
      o.connect(g).connect(this.ctx.destination); o.start(t); lfo.start(t); o.stop(t + len + .05); lfo.stop(t + len + .05);
    }
  },
  click() { this.tone(660, .06, 'triangle', .06, 990); },
  roar(dur = 3, vol = .32) { this.hiss(dur, 'bandpass', 650, vol, { q: .5, attack: .25 }); this.hiss(dur * .8, 'highpass', 2200, vol * .25, { attack: .3 }); },
  goal() { this.roar(3.4, .42); this.tone(392, .5, 'sawtooth', .04); this.tone(523, .7, 'sawtooth', .04, null, .18); },
  aww() { this.hiss(1.4, 'lowpass', 900, .22, { f2: 250, attack: .1 }); this.tone(180, .35, 'sawtooth', .04, 110); },
  coin() { this.tone(1320, .09, 'square', .04); this.tone(1760, .16, 'square', .04, null, .08); },
  whoosh() { this.hiss(.7, 'bandpass', 300, .25, { f2: 3500, q: 1.2, attack: .2 }); },
  boom() { this.tone(110, .9, 'sine', .45, 35); this.hiss(.7, 'lowpass', 1200, .3, { f2: 120, attack: .005 }); },
  clunk() { this.hiss(.18, 'lowpass', 500, .35, { attack: .005 }); this.tone(70, .25, 'square', .08, 40); },
  ambient(on) {
    if (!this.ok() && on) return;
    if (this.amb) { try { this.amb.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + .6); const s = this.amb.s; setTimeout(() => { try { s.stop(); } catch (e) { } }, 700); } catch (e) { } this.amb = null; }
    if (!on) return;
    const s = this.ctx.createBufferSource(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noise; s.loop = true; fl.type = 'lowpass'; fl.frequency.value = 520; g.gain.value = 0; g.gain.linearRampToValueAtTime(.05, this.ctx.currentTime + 1.5);
    s.connect(fl).connect(g).connect(this.ctx.destination); s.start(); this.amb = { s, g };
  },
};

/* ---------------- voz ---------------- */
function say(text, rate = .9, count = false) {
  if (count) { S.listens = (S.listens || 0) + 1; save(); }
  if (!TTS || !S.voice || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Natural|Aria|Jenny/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { }
}
if (TTS) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) { }

/* ---------------- carta de jugador ---------------- */
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const PROF = {
  ST: [2, 5, -6, 0, -45, -2], LW: [6, -2, -3, 4, -48, -12], RW: [6, -2, -3, 4, -48, -12], CAM: [-4, -1, 4, 5, -35, -14],
  CM: [-8, -6, 4, 1, -10, -6], CDM: [-14, -14, -1, -5, 1, 2], CB: [-12, -40, -18, -20, 3, 0], LB: [4, -28, -6, -4, -6, -6],
  RB: [4, -28, -6, -4, -6, -6], RM: [-4, -4, 6, -2, -25, -8], GK: [0, -1, -8, 2, -30, -2],
};
function stats(p, ovr) {
  const h = hash(p.id), off = PROF[p.pos];
  const labels = p.pos === 'GK' ? ['EST', 'PAR', 'SAQ', 'REF', 'VEL', 'POS'] : ['RIT', 'TIR', 'PAS', 'REG', 'DEF', 'FÍS'];
  return labels.map((l, i) => [l, Math.max(25, Math.min(99, ovr + off[i] + (((h >> (i * 4)) & 7) - 3)))]);
}
function cardHTML(p, opts = {}) {
  if (opts.locked) return `<div class="pcard locked"><div class="pc-in"><div class="pc-frame"></div><div class="pc-top"><span class="pc-pos">${POS_ES[p.pos]}</span>${flag(p.c)}</div><div class="pc-q">?</div><div class="pc-name">? ? ?</div><div class="pc-tier">${TIERS[tierBy(p, p.ovr)].name}</div></div></div>`;

}

function mc(o) { return Object.assign({ type: 'mc' }, o, { options: o.keep ? o.options : shuffle(uniq(o.options)) }); }
function matchQ(o) {
  const idx = o.pairs.map((_, i) => i);
  return { type: 'match', prompt: o.prompt || 'Match the pairs.', es: o.es || 'Uní cada palabra con su pareja.', tip: o.tip, pairs: o.pairs, left: shuffle(idx), right: shuffle(idx), got: [], mistakes: 0 };
}
function orderQ(words, punct, tip, extra) {
  const pool = shuffle([...words, ...(extra ? [extra] : [])]);
  return { type: 'order', prompt: 'Put the words in order.', es: 'Ordená las palabras para armar la oración.', words, pool, punct, tip, sel: [] };
}
function many(n, fn) {
  const out = [], seen = new Set();
  for (let k = 0; out.length < n && k < n * 25; k++) { const q = fn(); const key = (q.body || '') + '|' + q.answer + '|' + (q.say || ''); if (!seen.has(key)) { seen.add(key); out.push(q); } }
  return out;
}
const others = (pool, ans, n = 3) => sample(pool.filter(x => x !== ans), n);
const flagLabel = v => `${flag(v, 'flag mid')} <span>${esc(CN(v))}</span>`;

  const rep = sample(PR, 5).map(([w, a]) => {

function genL2() {

const AFF = [['She', 'is', 'French'], ['He', 'is', 'a goalkeeper'], ['They', 'are', 'from Peru'], ['I', 'am', 'tired'], ['We', 'are', 'in the final'], ['It', 'is', 'my ball'], ['You', 'are', 'late']];
const negOf = (s, v) => v === 'am' ? 'am not' : v === 'is' ? "isn't" : "aren't";

function rollTier(kind, guarantee) {
  const r = Math.random(); let t;
  if (kind === 'oro' || kind === 'bienvenida') t = r < .02 ? 'elite' : r < .2 ? 'estrella' : 'oro';
  else if (kind === 'estrella') t = r < .03 ? 'icono' : r < .15 ? 'elite' : r < .6 ? 'estrella' : 'oro';
  else t = r < .08 ? 'icono' : r < .43 ? 'elite' : r < .83 ? 'estrella' : 'oro';
  if (guarantee && TIER_ORDER.indexOf(t) < TIER_ORDER.indexOf(guarantee)) t = guarantee === 'elite' && Math.random() < .2 ? 'icono' : guarantee;
  return t;
}
function drawPlayer(t) { const pool = PLAYERS.filter(p => tierBy(p, p.ovr) === t); let p = pick(pool); if (S.cards[p.id] && Math.random() < .6) p = pick(pool); return p; }

  for (let i = 0; i < 12; i++) {
    const y0 = yOf(i / 12), y1 = yOf((i + 1) / 12), k = .25 + .75 * L, c = i % 2 ? [26, 104, 54] : [31, 118, 62];
    x.fillStyle = `rgb(${c[0] * k | 0},${c[1] * k | 0},${c[2] * k | 0})`;
    x.beginPath(); x.moveTo(edge(y0, -1), y0); x.lineTo(edge(y0, 1), y0); x.lineTo(edge(y1, 1), y1); x.lineTo(edge(y1, -1), y1); x.fill();

  const rx = (edge(my, 1) - edge(my, -1)) * .11; x.beginPath(); x.ellipse(w / 2, my, rx, rx * .3, 0, 0, Math.PI * 2); x.stroke();
  x.strokeRect(w / 2 - w * .09, ly, w * .18, (yOf(.12) - ly));
  // torres de luz
  x.globalCompositeOperation = 'lighter';
  const TX = [.07, .3, .7, .93];
  STD.sway = REDUCED ? 0 : Math.sin(now / 2400) * .04;
  TX.forEach((tx, i) => {

    x.fillStyle = gl; x.fillRect(px - h * .4, py - h * .4, h * .8, h * .8);
    const bx = px + (w / 2 - px) * .45 + w * STD.sway * (i % 2 ? 1 : -1), bg = x.createLinearGradient(px, py, bx, h);

  if (STD.lights >= 2 && !REDUCED) for (let i = 0; i < 3; i++) if (Math.random() < .6) STD.flashes.push({ x: Math.random() * w, y: h * .07 + Math.random() * (hz - h * .12), a: 1, r: (1 + Math.random() * 2) * STD.s * 1.6 });

  const hz2 = x.createLinearGradient(0, hz - h * .1, 0, hz + h * .1); hz2.addColorStop(0, 'rgba(160,190,255,0)'); hz2.addColorStop(.5, `rgba(160,190,255,${.06 * L})`); hz2.addColorStop(1, 'rgba(160,190,255,0)');
  x.fillStyle = hz2; x.fillRect(0, hz - h * .1, w, h * .2);

}
function stdLoop(now) {

}

const FX = { c: document.getElementById('fx'), p: [], run: false };
FX.x = FX.c.getContext('2d');
function fxSize() { FX.c.width = innerWidth; FX.c.height = innerHeight; }
function fxLoop() {
  const { x, c } = FX; x.clearRect(0, 0, c.width, c.height);
  FX.p = FX.p.filter(p => p.life > 0);
  for (const p of FX.p) {
    p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.life--; p.rot += p.vr;
    x.globalAlpha = Math.min(1, p.life / 30); x.fillStyle = p.col;
    if (p.kind === 'conf') { x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); x.restore(); }
    else { x.beginPath(); x.arc(p.x, p.y, p.s, 0, Math.PI * 2); x.fill(); }
  }
  x.globalAlpha = 1;
  if (FX.p.length) requestAnimationFrame(fxLoop); else { FX.run = false; x.clearRect(0, 0, c.width, c.height); }
}
function fxGo() { if (REDUCED) { FX.p = []; return; } if (!FX.run) { FX.run = true; fxSize(); requestAnimationFrame(fxLoop); } }
function confetti(cols = ['#1EE3B4', '#FFC93C', '#FF3D8B', '#5CC8FF', '#FFFFFF'], n = 150) {
  for (let i = 0; i < n; i++) FX.p.push({ kind: 'conf', x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .4, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, g: .06, s: 4 + Math.random() * 4, col: pick(cols), life: 140 + rnd(80), rot: Math.random() * 6, vr: (Math.random() - .5) * .3 });
  fxGo();
}
function burst(x, y, col, n = 70) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6; FX.p.push({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .08, s: 1.5 + Math.random() * 2.5, col, life: 60 + rnd(40), rot: 0, vr: 0 }); }
  fxGo();
}

/* ---------- partido ---------- */
let M = null;
function startLevel(id, skipTut) {
  if (!S.tut && !skipTut) return tutorial(id);
  const L = LEVELS[id - 1];
  M = { mode: 'level', L, qs: L.gen().map(q => Object.assign(q, { lvl: L.id })), i: 0, you: 0, them: 0, coins: 0, hint: false, quitArm: false, text: false, streak: 0, best: 0, scorers: {} };
  stdMode('menu'); AU.whistle(1); AU.ambient(true);
  renderMatch(); autoListen();
}
function startDrill(pid) {
  let pool = LEVELS.filter(L => S.levels[L.id]?.won && L.id !== 12); if (!pool.length) pool = [LEVELS[0]];
  const qs = []; while (qs.length < 3) { const L = pick(pool); qs.push(Object.assign(pick(L.gen()), { lvl: L.id })); }
  M = { mode: 'drill', pid, qs, i: 0, you: 0, them: 0, coins: 0, hint: false, quitArm: false, text: false, streak: 0, best: 0, scorers: {} };
  AU.whistle(1); renderMatch(); autoListen();
}
const curQ = () => M.qs[M.i];
function autoListen() { const q = curQ(); if (q && q.listen) setTimeout(() => say(q.listen, .85), 400); }
const ini3 = n => String(n).replace(/[^A-Za-zÀ-ÿ ]/g, '').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 3).toUpperCase() || 'FC';
const KEYS = [['A', '#2DBE60'], ['B', '#E5484D'], ['X', '#3D7BFF'], ['Y', '#E9B420']];

function renderMatch() {
  const q = curQ(), n = M.qs.length, drill = M.mode === 'drill';
  const home = drill ? 'Entrenamiento' : clubName(), away = drill ? PBY[M.pid].name : (M.away || M.L.rival);
  const minute = Math.round((M.i + (q.done ? 1 : 0)) / n * 90);
  const dots = M.qs.map((x, i) => `<i class="${x.done ? (x.correct ? 'ok' : 'bad') : i === M.i ? 'cur' : ''}"></i>`).join('');
  showOv(`
    <div class="mtop"><button class="link" data-act="quit">${M.quitArm ? 'Tocá otra vez para salir' : 'Salir'}</button><span class="eyebrow">${M.title ? esc(M.title) : drill ? 'Entrenamiento' : `Fecha ${M.L.id} · ${esc(M.L.en)}`}</span></div>
    <div class="bugrow">
      <div class="bug"><span class="tm">${crest(home, S.colors)}${esc(ini3(home))}</span><span class="sc">${M.you}&nbsp;-&nbsp;${M.them}</span><span class="tm">${esc(ini3(away))}${drill ? flag(PBY[M.pid].c) : crest(away, M.L.c)}</span><span class="min">${minute}'</span></div>
      <div class="dots" aria-label="Jugadas">${dots}</div>
    </div>
    ${qHTML(q)}
    ${q.done ? fbHTML(q) : ''}`);
  const fb = $ov.querySelector('.fb'); if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function qHTML(q) {
  let body = '';
  if (q.listen) {
    body = `<div class="listen"><button class="say huge" data-act="listen" aria-label="Escuchar">${ICON.speaker}</button>
      <div class="row"><button class="say alt" data-act="listen" data-slow="1">Más lento</button><button class="say alt" data-act="showtext">${M.text || !TTS ? 'Texto visible' : 'Ver texto'}</button></div>
      ${M.text || !TTS || q.done ? `<p class="qbody center">${esc(q.listen)}</p>` : ''}</div>`;
  } else if (q.body) body = `<div class="qbody">${q.body}</div>`;
  const sayIt = q.say && !q.listen ? sayBtn(q.say, 'alt') : '';
  let ans = '';
  if (q.type === 'mc') {
    ans = `<div class="opts ${q.long ? 'long' : ''}">${q.options.map((o, i) => {
      const cls = q.done ? (o === q.answer ? 'ok' : o === q.picked ? 'bad' : 'dim') : '';
      return `<button class="opt ${cls}" data-act="opt" data-i="${i}" ${q.done ? 'disabled' : ''}><span class="key" style="--k:${KEYS[i % 4][1]}">${KEYS[i % 4][0]}</span><span class="val">${q.label ? q.label(o) : esc(o)}</span></button>`;
    }).join('')}</div>`;
  } else if (q.type === 'order') {

    const ph = Array.from({ length: Math.max(0, q.words.length - q.sel.length) }, () => '<span class="ph"></span>').join('');
    ans = `<div class="slots">${chosen}${ph}<span class="punct">${q.punct}</span></div>
      <div class="pool">${q.pool.map((w, k) => q.sel.includes(k) ? '' : `<button class="chipw" data-act="pickw" data-k="${k}" ${q.done ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>
      ${q.done ? '' : `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="check" ${q.sel.length === q.words.length ? '' : 'disabled'}>Comprobar</button>${q.sel.length ? '<button class="btn ghost" data-act="clearw">Borrar</button>' : ''}</div>`}
      ${q.pool.length > q.words.length && !q.done ? '<p class="muted" style="font-size:14px;font-weight:600">Ojo: sobra una palabra.</p>' : ''}`;
  } else if (q.type === 'match') {
    const item = (side, k) => { const done = q.got.includes(k) || q.done, sel = (side === 'l' ? M.selL : M.selR) === k; return `<button class="mi ${done ? 'done' : ''} ${sel ? 'sel' : ''}" data-act="m${side}" data-k="${k}" ${done ? 'disabled' : ''}>${q.pairs[k][side === 'l' ? 0 : 1]}</button>`; };
    ans = `<div class="match"><div class="mcol">${q.left.map(k => item('l', k)).join('')}</div><div class="mcol">${q.right.map(k => item('r', k)).join('')}</div></div>
      ${q.mistakes ? `<p class="muted" style="font-size:14px;font-weight:600">Errores: ${q.mistakes} (con 2 errores es gol del rival)</p>` : ''}`;
  }
  return `<div class="panel qcard">
    <div class="qhead"><div><h2 class="qprompt">${esc(q.prompt)}</h2>
      ${M.hint ? `<div class="qes">${esc(q.es)}</div>` : `<button class="link" data-act="hint" style="color:var(--sky)">Ver ayuda en castellano</button>`}</div>${sayIt}</div>
    ${body}${ans}</div>`;
}
function fbHTML(q) {
  let a = '';
  if (!q.correct && q.type === 'mc') a = `Respuesta correcta: ${q.label ? q.label(q.answer) : esc(q.answer)}`;
  if (!q.correct && q.type === 'order') a = `Respuesta correcta: ${esc(q.words.join(' ') + q.punct)}`;
  const last = M.i === M.qs.length - 1;
  return `<div class="fb ${q.correct ? 'ok' : 'bad'}">
    <h3>${q.correct ? `¡Golazo! +${M.mode === 'drill' ? 5 : 10} monedas` : 'Gol del rival'}</h3>
    ${a ? `<div class="ans">${a}</div>` : ''}${q.tip ? `<div class="tip">${q.tip}</div>` : ''}
    <button class="btn wide" data-act="next">${last ? 'Final del partido' : 'Siguiente jugada'}</button></div>`;
}
function pickScorer() {
  const xi = buildXI().filter(Boolean); if (!xi.length) return null;
  const w = p => ['ST', 'LW', 'RW'].includes(p.pos) ? 5 : ['CAM', 'RM', 'CM'].includes(p.pos) ? 2 : p.pos === 'GK' ? 0 : 1;
  const tot = xi.reduce((s, p) => s + w(p), 0); let r = Math.random() * tot;
  for (const p of xi) { r -= w(p); if (r <= 0) return p; } return xi[0];
}
function celebrate(ok, minute) {
  const d = document.createElement('div');
  if (ok) {
    const sc = M.mode === 'drill' ? PBY[M.pid] : pickScorer();
    if (sc) M.scorers[sc.id] = (M.scorers[sc.id] || 0) + 1;
    d.className = 'goal';
    d.innerHTML = `<span class="gt">Gol</span><span class="gs">${minute}' · ${esc(sc ? sc.name : clubName())}</span><span class="ge">Goal by ${esc(sc ? sc.name : clubName())}!</span>`;

  } else {
    d.className = 'goal rival';
    d.innerHTML = `<span class="gt">Gol rival</span><span class="gs">${minute}' · ${esc(M.mode === 'drill' ? 'Fallaste' : M.L.rival)}</span>`;
    AU.aww();
  }
  document.body.appendChild(d); setTimeout(() => d.remove(), ok ? 1900 : 1500);
}
function resolve(ok) {
  const q = curQ(); q.done = true; q.correct = ok;
  if (M.mode !== 'test') track(q, ok);
  const minute = Math.round((M.i + 1) / M.qs.length * 90);
  if (ok) { M.you++; M.coins += M.mode === 'drill' ? 5 : 10; M.streak++; M.best = Math.max(M.best, M.streak); }
  else { M.them++; M.streak = 0; }
  celebrate(ok, minute);
  if (ok && q.sayAns && q.type === 'mc' && !q.label) setTimeout(() => say(q.answer), 900);
  else if (ok && q.say) setTimeout(() => say(q.say), 900);
  else if (q.type === 'order' && ok) setTimeout(() => say(q.words.join(' ') + q.punct), 900);

}
function nextQ() {
  M.i++; M.hint = false; M.text = false; M.selL = M.selR = undefined; M.quitArm = false; AU.click();
  if (M.i >= M.qs.length) return (({ drill: endDrill, test: endTest, review: endReview, chal: endChal })[M.mode] || endMatch)();
  renderMatch(); $ov.scrollTop = 0; autoListen();
}
function endMatch() {
  const L = M.L, n = M.qs.length, won = M.you > M.them, draw = M.you === M.them, ratio = M.you / n;
  const stars = won ? (ratio >= .875 ? 3 : ratio >= .75 ? 2 : 1) : 0;
  const prev = S.levels[L.id] || { won: false, stars: 0 }, firstWin = won && !prev.won;

  S.coins += coins; if (firstWin) S.packs.push(L.reward); if (won) addPoints(3);

  const champ = firstWin && L.id === 12, nextL = LEVELS[L.id];
  const mvpId = Object.entries(M.scorers).sort((a, b) => b[1] - a[1])[0]?.[0], mvp = mvpId && PBY[mvpId];
  showOv(`<div class="result">

    </div>
    ${mvp ? `<div class="panel mvp">${cardHTML(mvp, { mini: true })}<div><div class="eyebrow">Jugador del partido</div><p class="h2" style="font-size:26px">${esc(mvp.name)}</p><p class="muted" style="font-weight:600">${esc(mvp.name)} is the man of the match!</p></div></div>` : ''}

function mergeSaves(a, b) {

function addQuestion() {
  const u = ED.units[ED.cur], T = ED.tmp, tip = (T.tip || '').trim(); let q = null, err = '';
  if (ED.qtype === 'mc') {
    const wrong = (T.wrong || '').split(',').map(x => x.trim()).filter(Boolean).slice(0, 3);
    if (!(T.q || '').trim() || !(T.ans || '').trim() || !wrong.length) err = 'Completá la pregunta, la respuesta correcta y al menos una incorrecta.';
    else q = { type: 'mc', q: T.q.trim(), answer: T.ans.trim(), wrong, tip };
  } else if (ED.qtype === 'order') {
    if ((T.sent || '').trim().split(/\s+/).length < 2) err = 'Escribí una frase de al menos 2 palabras.';
    else q = { type: 'order', sentence: T.sent.trim(), tip };
  } else {
    const pairs = (T.pairs || '').split('\n').map(l => l.split('=').map(x => x.trim())).filter(p => p.length === 2 && p[0] && p[1]).slice(0, 5);
    if (pairs.length < 2) err = 'Escribí al menos 2 parejas con el signo = en el medio.';
    else q = { type: 'match', pairs, tip };
  }
  if (err) { ED.msg = err; return profe(); }

}
function parseBulk(text) {
  const out = [], bad = [];
  for (const raw of String(text).split('\n')) {
    const line = raw.trim().replace(/^\d+[.)]\s*/, ''); if (!line) continue; let m;
    if ((m = line.match(/^(ORDER|ORDENAR)\s*:\s*(.+)$/i))) { const [snt, tip] = m[2].split('|').map(x => x.trim()); if (snt.split(/\s+/).length >= 2) out.push({ type: 'order', sentence: snt, tip: tip || '' }); else bad.push(raw); continue; }
    if ((m = line.match(/^(MATCH|UNIR)\s*:\s*(.+)$/i))) { const [ps, tip] = m[2].split('|').map(x => x.trim()); const pairs = ps.split(';').map(x => x.split('=').map(y => y.trim())).filter(x => x.length === 2 && x[0] && x[1]); if (pairs.length >= 2) out.push({ type: 'match', pairs: pairs.slice(0, 5), tip: tip || '' }); else bad.push(raw); continue; }
    const parts = line.replace(/^(MC|OPCION|OPCIÓN)\s*:\s*/i, '').split('|').map(x => x.trim());
    const wrong = (parts[2] || '').split(',').map(x => x.trim()).filter(Boolean).slice(0, 3);
    if (parts[0] && parts[1] && wrong.length) out.push({ type: 'mc', q: parts[0], answer: parts[1], wrong, tip: parts[3] || '' }); else bad.push(raw);
  }
  return { out, bad };
}
function cleanAI(list) {
  const ok = [];
  for (const q of Array.isArray(list) ? list : []) {
    if (!q || typeof q !== 'object') continue;
    if (q.type === 'order' && typeof q.sentence === 'string' && q.sentence.trim().split(/\s+/).length >= 2) ok.push({ type: 'order', sentence: q.sentence.trim(), tip: String(q.tip || '') });
    else if (q.type === 'match' && Array.isArray(q.pairs)) { const pairs = q.pairs.filter(p => Array.isArray(p) && p.length === 2 && p[0] && p[1]).map(p => [String(p[0]), String(p[1])]).slice(0, 5); if (pairs.length >= 2) ok.push({ type: 'match', pairs, tip: String(q.tip || '') }); }
    else if (typeof q.q === 'string' && q.answer && Array.isArray(q.wrong) && q.wrong.length) ok.push({ type: 'mc', q: q.q, answer: String(q.answer), wrong: q.wrong.map(String).filter(w => w !== String(q.answer)).slice(0, 3), tip: String(q.tip || '') });
  }

}

function tryMatch() {
  const q = curQ();
  if (q.done || M.selL === undefined || M.selR === undefined) return renderMatch();
  if (M.selL === M.selR) {
    q.got.push(M.selL); AU.click(); say(String(q.pairs[M.selL][1]).replace(/<[^>]+>/g, ''));
    M.selL = M.selR = undefined;
    if (q.got.length === q.pairs.length) return resolve(q.mistakes <= 1);
    return renderMatch();
  }
  q.mistakes++; renderMatch();
  $ov.querySelectorAll('.mi.sel').forEach(el => el.classList.add('wrong'));
  M.selL = M.selR = undefined;
  setTimeout(() => { if (M && curQ() === q && !q.done) renderMatch(); }, 450);
}

  set: (path, data, merge = true) => setDoc(doc(db, path), { ...data, updatedAt: serverTimestamp() }, { merge }),
  list: path => getDocs(collection(db, path)),
  del: path => deleteDoc(doc(db, path)),
};
dispatchEvent(new Event('fb-ready'));
</script>
</body>
</html>
