# Publica firestore.rules en Firebase cada vez que cambian en main.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (el JSON de la cuenta de servicio de Firebase).
name: Publicar reglas de Firebase

on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/reglas-firebase.yml]
  workflow_dispatch:

jobs:
  publicar-reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar credenciales
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/cuenta-servicio.json"

      - name: Publicar reglas
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cuenta-servicio.json
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@13.29.1 deploy --only firestore:rules --project golazo-33a4b --non-interactive 2>&1 | tee salida.txt; then
            # mostrar el error como anotación para poder leerlo desde la página del workflow
            grep -iE "error|denied|permission|enable|api|forbidden|credential|not found" salida.txt | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
